name: test-addon

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      of_ref:
        description: "openFrameworks branch or tag (default: master)"
        default: master

permissions:
  contents: read

env:
  OF_REF: ${{ inputs.of_ref || 'master' }}
  OF_LIBS_VERSION: latest
  ADDON_NAME: ofxAddonTemplate

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux64 # Project Generator CLI token
            scripts_platform: linux
          - os: macos-15
            platform: osx
            scripts_platform: osx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: addon
      - name: Clone openFrameworks
        run: git clone --depth 1 --branch "$OF_REF" https://github.com/openframeworks/openFrameworks "$HOME/openFrameworks"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          cd "$HOME/openFrameworks"
          sudo ./scripts/ci/linux/64/install.sh
      - name: Install OF libraries and Project Generator
        env:
          SCRIPTS_PLATFORM: ${{ matrix.scripts_platform }}
        run: |
          cd "$HOME/openFrameworks"
          ./scripts/"$SCRIPTS_PLATFORM"/download_libs.sh -t "$OF_LIBS_VERSION"
          ./scripts/dev/download_pg.sh -p "$SCRIPTS_PLATFORM"
      - name: Install addon
        run: |
          mv "$GITHUB_WORKSPACE/addon" "$HOME/openFrameworks/addons/$ADDON_NAME"
      - name: Generate and build examples with make
        run: |
          export OF_ROOT="$HOME/openFrameworks"
          for ex in "$OF_ROOT/addons/$ADDON_NAME"/example_*; do
            [ -d "$ex/src" ] || continue
            "$OF_ROOT/projectGenerator/projectGenerator" -o "$OF_ROOT" \
              -p "${{ matrix.platform }}" "$ex"
            make -C "$ex" -j3 Release
          done
      - name: Build addon and examples with CMake
        run: |
          cmake -S "$HOME/openFrameworks/addons/$ADDON_NAME" -B "$RUNNER_TEMP/addon-build" \
            -DOF_ROOT="$HOME/openFrameworks" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/addon-build" --parallel 3
